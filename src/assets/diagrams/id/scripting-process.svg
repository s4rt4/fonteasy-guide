<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img"><title>Skrip berjalan di proses Python sendiri dan berbicara dengan FontEasy lewat perintah.</title><defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1f2330"/></marker><marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b5bf0"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2a9d8f"/></marker></defs><rect x="20" y="30" width="330" height="330" rx="10" fill="#ffffff" stroke="#0f0e3d" stroke-width="2"/><text x="185" y="62" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="22" text-anchor="middle" fill="#0f0e3d" font-weight="bold">FontEasy</text><rect x="45" y="85" width="280" height="70" rx="10" fill="#eef0f7" stroke="#9aa0b4" stroke-width="1.5"/><text x="185" y="115" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1f2330" font-weight="bold">Panel Scripting</text><text x="185" y="140" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1f2330">atau perintah plugin</text><rect x="45" y="185" width="280" height="70" rx="10" fill="#c9c9ff" stroke="#5b5bf0" stroke-width="1.5"/><text x="185" y="215" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1f2330" font-weight="bold">Perintah</text><text x="185" y="240" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1f2330">sama dengan yang dipakai menu</text><rect x="45" y="280" width="280" height="60" rx="10" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.5"/><text x="185" y="316" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2a9d8f" font-weight="bold">Font Anda yang terbuka</text><line x1="185" y1="255" x2="185" y2="278" stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#m-green)"/><rect x="450" y="30" width="330" height="330" rx="10" fill="#ffffff" stroke="#0f0e3d" stroke-width="2"/><text x="615" y="62" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="22" text-anchor="middle" fill="#0f0e3d" font-weight="bold">Python (python.exe)</text><rect x="475" y="85" width="280" height="120" rx="10" fill="#eef0f7" stroke="#9aa0b4" stroke-width="1.5"/><text x="615" y="112" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1f2330" font-weight="bold">Skrip Anda</text><text x="495" y="142" font-family="'Source Code Pro', Consolas, monospace" font-size="15" text-anchor="start" fill="#1f2330">f = fe.CurrentFont()</text><text x="495" y="166" font-family="'Source Code Pro', Consolas, monospace" font-size="15" text-anchor="start" fill="#1f2330">f["A"].width = 600</text><text x="495" y="190" font-family="'Source Code Pro', Consolas, monospace" font-size="15" text-anchor="start" fill="#1f2330">print("done")</text><rect x="475" y="230" width="280" height="70" rx="10" fill="#c9c9ff" stroke="#5b5bf0" stroke-width="1.5"/><text x="615" y="260" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1f2330" font-weight="bold">paket fonteasy</text><text x="615" y="285" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1f2330">CurrentFont, Glyph, fe.run</text><text x="615" y="335" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle" fill="#9aa0b4">program terpisah</text><line x1="350" y1="120" x2="472" y2="120" stroke="#5b5bf0" stroke-width="2.5" marker-end="url(#m-acc)"/><text x="411" y="108" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle" fill="#5b5bf0">1. jalankan</text><line x1="472" y1="245" x2="330" y2="212" stroke="#1f2330" stroke-width="2.5" marker-end="url(#m-ink)"/><text x="405" y="210" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1f2330">2. perintah</text><line x1="330" y1="238" x2="472" y2="272" stroke="#1f2330" stroke-width="2.5" marker-end="url(#m-ink)" stroke-dasharray="6 5"/><text x="395" y="285" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1f2330">3. jawaban</text><line x1="472" y1="160" x2="330" y2="150" stroke="#1f2330" stroke-width="2.5" marker-end="url(#m-ink)" stroke-dasharray="6 5"/><text x="401" y="145" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1f2330">print()</text><text x="400" y="392" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2a9d8f" font-weight="bold">Satu kali jalan = satu langkah di Edit › Batalkan</text></svg>
