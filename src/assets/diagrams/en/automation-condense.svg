<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img"><title>Squashing a letter thins its stems; Narrower keeps them</title><defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1f2330"/></marker><marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b5bf0"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e63946"/></marker><marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9aa0b4"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2a9d8f"/></marker></defs><path d="M40 80L100 80L100 175L180 175L180 80L240 80L240 300L180 300L180 215L100 215L100 300L40 300Z" fill="#eef0f7" stroke="#1f2330" stroke-width="2"/><line x1="40.0" y1="320" x2="100.0" y2="320" stroke="#e63946" stroke-width="2" marker-end="url(#m-red)" marker-start="url(#m-red)"/><path d="M330 80L372 80L372 175L428 175L428 80L470 80L470 300L428 300L428 215L372 215L372 300L330 300Z" fill="#ffffff" stroke="#9aa0b4" stroke-width="2"/><line x1="330.0" y1="320" x2="372.0" y2="320" stroke="#e63946" stroke-width="2" marker-end="url(#m-red)" marker-start="url(#m-red)"/><path d="M590 80L650 80L650 175L670 175L670 80L730 80L730 300L670 300L670 215L650 215L650 300L590 300Z" fill="#c9c9ff" stroke="#5b5bf0" stroke-width="2"/><line x1="590.0" y1="320" x2="650.0" y2="320" stroke="#e63946" stroke-width="2" marker-end="url(#m-red)" marker-start="url(#m-red)"/><text x="140" y="50" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="20" text-anchor="middle" fill="#1f2330" font-weight="bold">Original</text><text x="400" y="50" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="20" text-anchor="middle" fill="#9aa0b4" font-weight="bold">Squashed to 70%</text><text x="660" y="50" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="20" text-anchor="middle" fill="#5b5bf0" font-weight="bold">Narrower 70%</text><text x="400" y="350" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="18" text-anchor="middle" fill="#e63946" font-weight="normal">stems get thin</text><text x="660" y="350" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="18" text-anchor="middle" fill="#e63946" font-weight="normal">stems stay 60</text><text x="140" y="350" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="18" text-anchor="middle" fill="#e63946" font-weight="normal">60</text></svg>